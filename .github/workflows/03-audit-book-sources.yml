name: 03 分类逐书找源
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['02 分类独立精加工']
    types: [completed]
permissions: {contents: write, actions: read}
concurrency: {group: catalog-v3-book-source-audit, cancel-in-progress: false}
jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        category: [lianai, xuanhuan, yineng, kongbu, juqing, kehuan, xuanyi, qihuan, maoxian, fanzui, dongzuo, richang, jingji, wuxia, lishi, zhanzheng]
    runs-on: ubuntu-latest
    timeout-minutes: 330
    services:
      searxng:
        image: ghcr.io/liyan-lucky/searxng_diy:latest
        ports: ['8080:8080']
    env:
      SEARXNG_URL: http://localhost:8080
      SEARXNG_API_TOKEN: ${{ secrets.SEARXNG_API_TOKEN || '' }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt
      - name: 恢复该分类作品检查点
        uses: actions/cache@v4
        with:
          path: checkpoints/${{ matrix.category }}
          key: source-audit-${{ matrix.category }}-${{ hashFiles('parameters/catalog/zh-Hans/*.json') }}
          restore-keys: 'source-audit-${{ matrix.category }}-'
      - run: python scripts/audit_category_sources.py --parameters 'parameters/catalog/zh-Hans/${{ matrix.category }}.json' --checkpoint-dir 'checkpoints/${{ matrix.category }}' --output 'out/audits/${{ matrix.category }}.jsonl'
      - run: python scripts/select_sources.py --audits 'out/audits/${{ matrix.category }}.jsonl' --output 'out/best/${{ matrix.category }}.json'
      - uses: actions/upload-artifact@v4
        with: {name: 'source-${{ matrix.category }}', path: out/}
  merge:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    needs: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with: {pattern: source-*, path: generated/v3, merge-multiple: true}
      - run: python scripts/merge_best_sources.py --input-dir generated/v3/best --output generated/v3/best_sources.zh-Hans.json --domain-output generated/v3/domain_ledger.zh-Hans.json
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add generated/v3
          git diff --cached --quiet || git commit -m 'sources: refresh verified per-book winners'
          git pull --rebase origin main
          git push origin HEAD:main
