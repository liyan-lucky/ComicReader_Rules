name: 生成远程漫画规则

on:
  workflow_dispatch:
    inputs:
      rule_language:
        description: 语种
        required: true
        default: zh-Hans
        type: choice
        options: [zh-Hans, zh-Hant, en, ja, ko]
      min_rules:
        description: 最少有效规则数
        required: true
        default: '500'
      max_rules:
        description: 最大规则生成数
        required: true
        default: '1000'

permissions:
  contents: write

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    services:
      searxng:
        image: ghcr.io/liyan-lucky/searxng_diy:latest
        ports:
          - 8080:8080
        options: --health-cmd "wget -qO- http://localhost:8080/healthz || curl -sf http://localhost:8080/ || exit 1" --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      PIPELINE_LANGUAGE: ${{ inputs.rule_language || 'zh-Hans' }}
      PIPELINE_MIN_RULES: ${{ inputs.min_rules || '500' }}
      PIPELINE_MAX_RULES: ${{ inputs.max_rules || '1000' }}
      SEARXNG_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install -r tools/rule_discovery/requirements.txt
      - name: 从统一入口生成并校验规则与目录
        run: |
          python scripts/run_full_pipeline.py --language "$PIPELINE_LANGUAGE" \
            --min-rules "$PIPELINE_MIN_RULES" --max-rules "$PIPELINE_MAX_RULES" \
            --resume-from parameters
      - name: 提交达标产物
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/ generated/ rules/ catalog/
          if ! git diff --cached --quiet; then
            git commit -m "pipeline: refresh validated rules"
            git push origin HEAD:main
          fi
