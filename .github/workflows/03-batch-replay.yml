name: 03 五十本兼容性回放
run-name: "03 五十本兼容性回放（02 每批显式传递）"
on:
  workflow_dispatch:
permissions: {contents: write, actions: write}
concurrency: {group: catalog-v3-batch-replay, cancel-in-progress: false}
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt
      - name: 回放至少五十个不同作品来源
        run: python scripts/batch_replay_audit.py --audits-dir generated/v3/audits --output generated/v3/batch_replay.zh-Hans.json --limit 50 --workers 8
      - name: 提交兼容性报告
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add generated/v3/batch_replay.zh-Hans.json
          git diff --cached --quiet || git commit -m 'audit: replay 50 catalog candidates'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: 本批回放完成后显式传递到 04
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh workflow run 04-build-domain-rules.yml --ref main
