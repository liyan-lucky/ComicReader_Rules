name: 01 每日平台粗采集
on:
  workflow_dispatch:
    inputs:
      pages: {description: 每个平台每分类页数（0=自动抓到末页）, required: true, default: '0'}
  schedule:
    - cron: '20 18 * * *'
permissions: {contents: write}
concurrency: {group: catalog-v3-platform-collection, cancel-in-progress: false}
jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.matrix.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        run: echo "enabled=$(jq -c '[.platforms[] | select(.enabled != false) | .id]' config/platforms.json)" >> "$GITHUB_OUTPUT"
  collect:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.setup.outputs.enabled) }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt
      - name: 独立采集 ${{ matrix.platform }}
        run: python scripts/collect_platform.py --platform '${{ matrix.platform }}' --pages '${{ inputs.pages || 0 }}' --output-dir out
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: 'rough-${{ matrix.platform }}', path: out/, if-no-files-found: warn}
  prepare:
    if: always()
    needs: [setup, collect]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with: {pattern: rough-*, path: daily, merge-multiple: true}
      - name: 汇总平台采集状态
        run: |
          enabled=$(jq -c '[.platforms[] | select(.enabled != false) | .id]' config/platforms.json)
          ok=0; failed=0
          {
            echo "## 平台采集状态汇总"
            echo ""
            echo "| 平台 | 状态 | 条数 | 错误 |"
            echo "|---|---|---:|---|"
            for id in $(echo "$enabled" | jq -r '.[]'); do
              f="daily/${id}.status.json"
              if [ ! -f "$f" ]; then
                echo "| $id | ⚠️ missing | 0 | 状态文件缺失（job未产出artifact） |"
                failed=$((failed+1))
                continue
              fi
              st=$(jq -r '.status' "$f"); n=$(jq -r '.itemCount' "$f"); err=$(jq -r '.error' "$f" | cut -c1-120)
              if [ "$st" = "ok" ]; then
                echo "| $id | ✅ ok | $n | |"
                ok=$((ok+1))
              else
                echo "| $id | ❌ $st | $n | \`$err\` |"
                failed=$((failed+1))
              fi
            done
            echo ""
            echo "- 启用平台：$(echo "$enabled" | jq 'length')，成功：**$ok**，异常：**$failed**"
            echo "- 禁用平台清单与原因见 \`config/platforms.json\` 的 \`disableReason\` 字段"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$ok" -eq 0 ] && [ "$failed" -gt 0 ]; then
            echo "::error::所有启用平台均采集失败，请检查平台可达性或回退快照"
            exit 1
          fi
      - run: python scripts/aggregate_rough_catalog.py --input-dir daily --fallback-dir observations/rough/zh-Hans/platforms --platform-output-dir staging/platforms --output-dir staging/categories
      - uses: actions/upload-artifact@v4
        with: {name: rough-platform-snapshot, path: staging/}
  categorize:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        category: [lianai, xuanhuan, yineng, kongbu, juqing, kehuan, xuanyi, qihuan, maoxian, fanzui, dongzuo, richang, jingji, wuxia, lishi, zhanzheng]
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with: {name: rough-platform-snapshot, path: snapshot}
      - name: 独立生成 ${{ matrix.category }} 分类文件
        run: python scripts/aggregate_rough_catalog.py --input-dir snapshot/platforms --output-dir 'out/categories' --category '${{ matrix.category }}'
      - name: 规范化并去重 ${{ matrix.category }} 文字目录
        run: python scripts/refine_category.py --input 'out/categories/${{ matrix.category }}.jsonl' --category '${{ matrix.category }}' --language zh-Hans --config 'config/categories/${{ matrix.category }}.json' --output 'out/parameters/catalog/zh-Hans/${{ matrix.category }}.json'
      - uses: actions/upload-artifact@v4
        with: {name: 'rough-category-${{ matrix.category }}', path: out/}
  commit:
    needs: [prepare, categorize]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/download-artifact@v4
        with: {name: rough-platform-snapshot, path: snapshot}
      - uses: actions/download-artifact@v4
        with: {pattern: rough-category-*, path: category-files, merge-multiple: true}
      - name: 合并独立分类工件
        run: |
          mkdir -p observations/rough/zh-Hans/platforms observations/rough/zh-Hans/categories
          cp -a snapshot/platforms/. observations/rough/zh-Hans/platforms/
          cp -a category-files/categories/. observations/rough/zh-Hans/categories/
          cp -a category-files/parameters/. parameters/
          cp snapshot/categories/report.json observations/rough/zh-Hans/categories/report.json
          cp snapshot/categories/unclassified.jsonl observations/rough/zh-Hans/categories/unclassified.jsonl
      - name: 审计第一步文字目录
        run: python scripts/audit_text_catalog.py --parameters parameters/catalog/zh-Hans --platform-report observations/rough/zh-Hans/categories/report.json
      - name: 提交粗分类文件和平台状态
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add observations/rough/zh-Hans parameters/catalog/zh-Hans
          git diff --cached --quiet || git commit -m 'names: refresh audited platform text catalogs'
          bash scripts/ci_push_with_retry.sh
