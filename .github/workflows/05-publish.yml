name: 05 发布可读目录
on:
  workflow_dispatch:
  workflow_call:
permissions: {contents: write}
concurrency: {group: catalog-v3-publish, cancel-in-progress: false}
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements.txt
      - run: python scripts/publish_catalog.py --parameters parameters/catalog/zh-Hans --states state/search/zh-Hans --sources generated/v3/best_sources.zh-Hans.json --rules rules/index.zh-Hans.json --existing catalog/catalog.zh-Hans.json --output catalog/catalog.zh-Hans.json
      - run: python scripts/validate_release.py --incremental --catalog catalog/catalog.zh-Hans.json --rules rules/index.zh-Hans.json --sources generated/v3/best_sources.zh-Hans.json --output generated/v3/release_audit.zh-Hans.json
      - run: python scripts/build_cover_index.py --catalog catalog/catalog.zh-Hans.json --output generated/v3/cover_index.zh-Hans.json
      - run: python scripts/update_manifest.py --only-if-changed --section rules --tag "v3-$(date -u +%Y%m%d%H%M%S)" --language-code zh-Hans --language-name 简体中文
      - run: python scripts/update_manifest.py --only-if-changed --section catalog --tag "v3-$(date -u +%Y%m%d%H%M%S)" --language-code zh-Hans --language-name 简体中文
      - run: python scripts/update_manifest.py --only-if-changed --section coverAudit --tag "v3-$(date -u +%Y%m%d%H%M%S)" --language-code zh-Hans --language-name 简体中文
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add catalog/catalog.zh-Hans.json rules/index.zh-Hans.json generated/update_manifest.json generated/v3/release_audit.zh-Hans.json generated/v3/cover_index.zh-Hans.json
          git diff --cached --quiet || git commit -m 'publish: validated readable catalog and domain rules'
          bash scripts/ci_push_with_retry.sh
