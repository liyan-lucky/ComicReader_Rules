name: 09-publish-filter-words

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install -r requirements.txt

      - name: Regenerate filter_words.txt from dynamic ledger+catalog (same source as 05)
        run: |
          python scripts/generate_app_blacklist.py \
            --ledger generated/v3/domain_ledger.zh-Hans.json \
            --catalog catalog/catalog.zh-Hans.json \
            --output generated/app_blacklist.zh-Hans.json

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add generated/filter_words.txt generated/app_blacklist.zh-Hans.json
          if git diff --cached --quiet; then
            echo "No changes to filter_words.txt"
          else
            git commit -m "chore: refresh filter_words.txt from dynamic ledger [skip ci]"
            bash scripts/ci_push_with_retry.sh
          fi
