name: 全链路更新

on:
  workflow_dispatch:
    inputs:
      language:
        description: 语种
        required: true
        default: zh-Hans
        type: choice
        options: [zh-Hans, zh-Hant, en, ja, ko]
      min_rules:
        description: 最少有效站点规则数（完整性由域名覆盖保证）
        required: true
        default: '1'
      max_rules:
        description: 最大规则生成数
        required: true
        default: '1000'
      per_category:
        description: 每分类最少漫画数
        required: true
        default: '200'
      publish_release:
        description: 达标后发布 Release
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '0 0 1 * *'

permissions:
  contents: write

concurrency:
  group: comic-reader-rules-pipeline
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  pipeline:
    name: 漫画/漫书到最终产物
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    services:
      searxng:
        image: ghcr.io/liyan-lucky/searxng_diy:latest
        ports:
          - 8080:8080
        options: --health-cmd "wget -qO- http://localhost:8080/healthz || curl -sf http://localhost:8080/ || exit 1" --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      PIPELINE_LANGUAGE: ${{ inputs.language || 'zh-Hans' }}
      PIPELINE_MIN_RULES: ${{ inputs.min_rules || '1' }}
      PIPELINE_MAX_RULES: ${{ inputs.max_rules || '1000' }}
      PIPELINE_PER_CATEGORY: ${{ inputs.per_category || '200' }}
      PIPELINE_PUBLISH: ${{ inputs.publish_release || false }}
      SEARXNG_URL: ${{ secrets.SEARXNG_URL || 'http://localhost:8080' }}
      SEARXNG_API_TOKEN: ${{ secrets.SEARXNG_API_TOKEN || '' }}

    steps:
      - name: 检出主分支
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: main
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: python -m pip install -r tools/rule_discovery/requirements.txt

      - name: 等待在线搜索服务
        run: |
          for i in $(seq 1 30); do
            if curl -4 -fsS --connect-timeout 10 --max-time 45 -H "X-Search-Token: $SEARXNG_API_TOKEN" "$SEARXNG_URL/search?q=%E6%BC%AB%E7%94%BB&format=json" >/dev/null \
              && curl -4 -fsS --connect-timeout 10 --max-time 45 -H "X-Search-Token: $SEARXNG_API_TOKEN" "$SEARXNG_URL/search?q=%E6%BC%AB%E4%B9%A6&format=json" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "SearXNG unavailable" >&2
          exit 1

      - name: 运行唯一全链路入口
        run: |
          python scripts/run_full_pipeline.py \
            --language "$PIPELINE_LANGUAGE" \
            --min-rules "$PIPELINE_MIN_RULES" \
            --max-rules "$PIPELINE_MAX_RULES" \
            --per-category "$PIPELINE_PER_CATEGORY" \
            --per-domain-rules 1

      - name: 确认审计统计已生成
        if: ${{ always() }}
        run: |
          test -s "generated/pipeline_audit.${PIPELINE_LANGUAGE}.json"
          test -s "generated/domain_coverage.${PIPELINE_LANGUAGE}.json"
          test -s "generated/catalog_gaps.${PIPELINE_LANGUAGE}.json"
          test -s generated/parameter_provenance.json
          echo "审计统计已写入 Job Summary 和 generated/"

      - name: 保存成功或失败审计证据
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pipeline-audit-${{ env.PIPELINE_LANGUAGE }}-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            generated/pipeline_audit.${{ env.PIPELINE_LANGUAGE }}.json
            generated/domain_coverage.${{ env.PIPELINE_LANGUAGE }}.json
            generated/catalog_gaps.${{ env.PIPELINE_LANGUAGE }}.json
            generated/parameter_provenance.json
            generated/rulebot_report.${{ env.PIPELINE_LANGUAGE }}.json
            generated/domain_discovery_report.json

      - name: 提交最近一次审计状态
        if: ${{ always() && hashFiles(format('generated/pipeline_audit.{0}.json', env.PIPELINE_LANGUAGE)) != '' }}
        run: |
          set -euo pipefail
          python scripts/update_current_status.py \
            --language "$PIPELINE_LANGUAGE" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CURRENT_STATUS.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: refresh latest pipeline audit status"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: 提交已达标产物
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/update_manifest.py --section rules --tag "pipeline-$(date -u +'%Y%m%d')" --language-code "$PIPELINE_LANGUAGE"
          python scripts/update_manifest.py --section catalog --tag "pipeline-$(date -u +'%Y%m%d')" --language-code "$PIPELINE_LANGUAGE"
          git add config/ generated/ "rules/index.${PIPELINE_LANGUAGE}.json" "catalog/catalog.${PIPELINE_LANGUAGE}.json"
          if ! git diff --cached --quiet; then
            git commit -m "pipeline: publish validated ${PIPELINE_LANGUAGE} outputs"
            git push origin HEAD:main
          fi

      - name: 发布 Release
        if: ${{ env.PIPELINE_PUBLISH == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="pipeline-$(date -u +'%Y%m%d')"
          gh release create "$TAG" \
            "rules/index.${PIPELINE_LANGUAGE}.json" \
            "catalog/catalog.${PIPELINE_LANGUAGE}.json" \
            generated/update_manifest.json \
            --title "$TAG" --notes "Validated: rules>=${PIPELINE_MIN_RULES}, each category>=${PIPELINE_PER_CATEGORY}"
