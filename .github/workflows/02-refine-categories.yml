name: 02 分类完整分级处理
run-name: "02 分类完整分级处理（上游 01 #${{ github.event.workflow_run.id || '手动' }}）"
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['01 每日平台粗采集']
    types: [completed]
permissions: {contents: write, actions: read}
concurrency: {group: catalog-v3-category-pipelines, cancel-in-progress: false}
jobs:
  category_pipeline:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        category: [lianai, xuanhuan, yineng, kongbu, juqing, kehuan, xuanyi, qihuan, maoxian, fanzui, dongzuo, richang, jingji, wuxia, lishi, zhanzheng]
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 330
    services:
      searxng:
        image: ghcr.io/liyan-lucky/searxng_diy:latest
        ports: ['8080:8080']
    env:
      SEARXNG_URL: http://localhost:8080
      SEARXNG_API_TOKEN: ${{ secrets.SEARXNG_API_TOKEN || '' }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt
      - name: 恢复本类逐书检查点
        uses: actions/cache@v4
        with:
          path: checkpoints/${{ matrix.category }}
          key: category-v2-${{ matrix.category }}-${{ hashFiles('scripts/audit_category_sources.py', 'config/pipeline.json', format('config/categories/{0}.json', matrix.category), format('parameters/catalog/zh-Hans/{0}.json', matrix.category)) }}
          restore-keys: category-v2-${{ matrix.category }}-
      - name: 第二级：本类逐书搜索与三章节验证
        run: |
          for attempt in 1 2 3; do
            python scripts/audit_category_sources.py --parameters 'parameters/catalog/zh-Hans/${{ matrix.category }}.json' --category-config 'config/categories/${{ matrix.category }}.json' --checkpoint-dir 'checkpoints/${{ matrix.category }}' --output 'out/generated/v3/audits/${{ matrix.category }}.jsonl' && exit 0
            echo "第 $attempt 次审核失败，使用检查点重试"
          done
          exit 1
      - name: 第三级：本类选择章节最多的可读源
        run: python scripts/select_sources.py --audits 'out/generated/v3/audits/${{ matrix.category }}.jsonl' --output 'out/generated/v3/best/${{ matrix.category }}.json'
      - uses: actions/upload-artifact@v4
        with: {name: 'category-pipeline-${{ matrix.category }}', path: out/}
  merge:
    if: always() && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    needs: category_pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with: {pattern: category-pipeline-*, path: merged, merge-multiple: true}
      - name: 汇总分类产物并建立域名账本
        run: |
          cp -a merged/generated/. generated/
          python scripts/merge_best_sources.py --input-dir generated/v3/best --output generated/v3/best_sources.zh-Hans.json --domain-output generated/v3/domain_ledger.zh-Hans.json
      - name: 一次性提交所有分类结果
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add generated/v3
          git diff --cached --quiet || git commit -m 'categories: refresh independent staged pipelines'
          git pull --rebase origin main
          git push origin HEAD:main
