name: 生成公开漫画目录

on:
  workflow_dispatch:
    inputs:
      catalog_language:
        description: 语种
        required: true
        default: zh-Hans
        type: choice
        options: [zh-Hans, zh-Hant, en, ja, ko]
      target_count:
        description: 每分类最少漫画数
        required: true
        default: '200'

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PIPELINE_LANGUAGE: ${{ inputs.catalog_language || 'zh-Hans' }}
      PIPELINE_TARGET: ${{ inputs.target_count || '200' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install -r tools/rule_discovery/requirements.txt
      - name: 从统一入口生成并校验目录
        run: |
          python scripts/run_full_pipeline.py --language "$PIPELINE_LANGUAGE" \
            --per-category "$PIPELINE_TARGET" --resume-from parameters
      - name: 提交达标产物
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/ generated/ rules/ catalog/
          if ! git diff --cached --quiet; then
            git commit -m "pipeline: refresh validated catalog"
            git push origin HEAD:main
          fi
