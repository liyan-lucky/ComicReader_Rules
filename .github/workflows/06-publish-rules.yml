name: 06 发布规则索引
on:
  workflow_dispatch:
  workflow_call:
permissions: {contents: write}
concurrency: {group: catalog-v3-rules-publish, cancel-in-progress: false}
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements.txt
      - run: python scripts/update_manifest.py --only-if-changed --section rules --tag "v3-$(date -u +%Y%m%d%H%M%S)" --language-code zh-Hans --language-name 简体中文
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add generated/update_manifest.json
          git diff --cached --quiet || git commit -m 'rules: publish rule manifest'
          bash scripts/ci_push_with_retry.sh
